[project]
name = "ticket-classifier"
version = "0.1.0"
description = "Fine-tuned Qwen3-0.6B with LoRA/PEFT and TRL SFT for retail-banking ticket intent classification with structured JSON output; trained on Apple Silicon (MPS), exported to GGUF for llama-cpp-python inference."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "llama-cpp-python>=0.3.16",
    "peft>=0.18.1",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.2.0",
    "trl>=0.28.0",
]

[dependency-groups]
dev = [
    "gguf>=0.17.1",
    "sentencepiece>=0.2.1",
]
